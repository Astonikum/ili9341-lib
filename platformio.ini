[platformio]
src_dir = examples/color_ui

[env:esp32]
platform = espressif32
board = esp32dev
framework = arduino
lib_ldf_mode = deep+
build_flags = -Isrc
lib_deps =
  https://github.com/Astonikum/display-lib.git#v0.7.0
  https://github.com/Astonikum/adapter-common-lib.git#v0.2.0
  adafruit/Adafruit ILI9341 @ ^1.6.2
